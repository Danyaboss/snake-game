<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐍 Змейка — классическая игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container">
            <div class="info-panel">
                <div class="score-box">
                    <span>🍎</span>
                    <span id="score">0</span>
                </div>
                <div class="best-box">
                    <span>🏆</span>
                    <span id="bestScore">0</span>
                </div>
            </div>
            
            <canvas id="snakeCanvas" width="400" height="400"></canvas>
            
            <div class="controls">
                <button id="btnUp" class="control-btn">▲ Вверх</button>
                <button id="btnLeft" class="control-btn">◀ Лев</button>
                <button id="btnDown" class="control-btn">▼ Вниз</button>
                <button id="btnRight" class="control-btn">Прав ▶</button>
                <button id="restartBtn" class="restart-btn">🔄 Рестарт</button>
            </div>
            
            <div class="status" id="gameStatus">🎮 Игра активна</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
